services:
  - type: web
    name: lingua-speech-to-text
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lingua-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.5-transcribe-live

databases:
  - name: lingua-db
    plan: free
    databaseName: speech_to_text
    user: lingua
